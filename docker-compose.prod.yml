# Production stack: pulls prebuilt images from Docker Hub (tag from .env) and
# runs Caddy at the edge. Config comes from two files in this directory:
#   .env         -> image names + IMAGE_TAG + ROOT_DOMAIN + ACME_EMAIL (see .env.prod.example)
#   backend.env  -> backend runtime config/secrets (see backend.env.prod.example)
services:
  db:
    image: mongo:7
    container_name: catering-db
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - catering-network

  redis:
    image: redis:7-alpine
    container_name: catering-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - catering-network

  backend:
    image: ${IMAGE}:backend-${IMAGE_TAG}
    container_name: catering-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    environment:
      # Pinned here so Caddy's backend:5000 target is deterministic regardless of backend.env.
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - db
      - redis
    networks:
      - catering-network

  frontend:
    image: ${IMAGE}:frontend-${IMAGE_TAG}
    container_name: catering-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - catering-network

  caddy:
    image: caddy:2-alpine
    container_name: catering-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ROOT_DOMAIN=${ROOT_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - catering-network

volumes:
  mongodb_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  catering-network:
    driver: bridge
