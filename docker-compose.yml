services:
  db:
    image: mongo:7
    container_name: catering-db
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - catering-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: catering-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/catering-helper
    depends_on:
      - db
    networks:
      - catering-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: catering-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAIN_DOMAIN=localhost
    depends_on:
      - backend
    networks:
      - catering-network

  nginx:
    image: nginx:1.27-alpine
    container_name: catering-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - catering-network

volumes:
  mongodb_data:

networks:
  catering-network:
    driver: bridge
